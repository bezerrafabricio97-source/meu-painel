<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Meu Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171d;
    --surface:#1e232b;
    --surface-2:#262c36;
    --line:#333a45;
    --text:#f2efe6;
    --text-dim:#9aa3af;
    --agenda:#6c9bcf;
    --trabalho:#e0a458;
    --treino:#e0665a;
    --financas:#6fbf8b;
    --current:#6c9bcf;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:var(--font-body);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button, input, select{font-family:inherit;}
  .phone{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    background-image:radial-gradient(circle, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:16px 16px;
  }
  header{
    padding:28px 20px 18px;
    flex-shrink:0;
  }
  header .greeting{
    font-family:var(--font-display);
    font-weight:700;
    font-size:28px;
    letter-spacing:-0.01em;
    color:var(--text);
  }
  header .date{
    font-size:13px;
    color:var(--text-dim);
    margin-top:4px;
    text-transform:capitalize;
  }
  header .section-title{
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  header .section-title .bar{
    width:3px;
    height:18px;
    border-radius:2px;
    background:var(--current);
    transition:background .25s ease;
  }
  header .section-title h1{
    font-family:var(--font-display);
    font-size:19px;
    font-weight:600;
    margin:0;
  }

  main{
    flex:1;
    overflow-y:auto;
    padding:0 20px 110px;
  }

  /* cards / rows */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row-time{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--current);
    min-width:48px;
    flex-shrink:0;
  }
  .row-title{
    flex:1;
    font-size:15px;
  }
  .row-title.done{
    text-decoration:line-through;
    color:var(--text-dim);
  }
  .row-sub{
    font-size:12px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .del-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:16px;
    cursor:pointer;
    padding:6px;
    line-height:1;
    border-radius:8px;
  }
  .del-btn:hover{color:var(--treino);}
  .checkbox{
    width:20px;height:20px;
    border-radius:6px;
    border:1.5px solid var(--line);
    flex-shrink:0;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);
    transition:background .15s ease, border-color .15s ease;
  }
  .checkbox.checked{
    background:var(--current);
    border-color:var(--current);
  }
  .checkbox svg{width:12px;height:12px;opacity:0;transition:opacity .15s ease;}
  .checkbox.checked svg{opacity:1;}

  .empty{
    border:1.5px dashed var(--line);
    border-radius:16px;
    padding:36px 20px;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    line-height:1.5;
  }
  .empty .big{
    font-family:var(--font-display);
    font-size:17px;
    color:var(--text);
    display:block;
    margin-bottom:6px;
  }

  .fab{
    position:fixed;
    right:calc(50% - 215px + 20px);
    bottom:96px;
    width:52px;height:52px;
    border-radius:16px;
    background:var(--current);
    border:none;
    color:#14171d;
    font-size:26px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
    transition:background .25s ease, transform .1s ease;
    z-index:20;
  }
  .fab:active{transform:scale(0.94);}
  @media (max-width:430px){
    .fab{right:20px;}
  }

  .balance-card{
    border-radius:18px;
    padding:22px 18px;
    margin-bottom:16px;
    background:var(--surface);
    border:1px solid var(--line);
  }
  .balance-card .label{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;}
  .balance-card .amount{
    font-family:var(--font-mono);
    font-size:34px;
    font-weight:600;
    margin-top:6px;
  }
  .amount.pos{color:var(--financas);}
  .amount.neg{color:var(--treino);}
  .tx-amount{font-family:var(--font-mono);font-size:14px;font-weight:600;}
  .tx-amount.pos{color:var(--financas);}
  .tx-amount.neg{color:var(--treino);}

  .stat-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--surface-2);
    border-radius:999px;
    padding:6px 12px;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:14px;
  }

  /* tab bar - signature element: planner-style pull tabs */
  nav.tabbar{
    position:fixed;
    left:0;right:0;bottom:0;
    max-width:430px;
    margin:0 auto;
    display:flex;
    background:var(--surface);
    border-top:1px solid var(--line);
    padding:8px 8px calc(10px + env(safe-area-inset-bottom));
    gap:6px;
    z-index:10;
  }
  .tab{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 4px 6px;
    background:transparent;
    border:none;
    border-radius:12px 12px 4px 4px;
    color:var(--text-dim);
    cursor:pointer;
    transition:transform .18s ease, background .18s ease, color .18s ease;
    position:relative;
  }
  .tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .tab .tlabel{font-size:10.5px;font-weight:600;}
  .tab.active{
    transform:translateY(-9px);
    color:#14171d;
  }
  .tab .badge{
    position:absolute;
    top:2px; right:14%;
    min-width:15px;height:15px;
    border-radius:999px;
    background:var(--treino);
    color:#14171d;
    font-size:9px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
    padding:0 3px;
  }
  .tab[data-tab="agenda"].active{background:var(--agenda);}
  .tab[data-tab="trabalho"].active{background:var(--trabalho);}
  .tab[data-tab="treino"].active{background:var(--treino);}
  .tab[data-tab="financas"].active{background:var(--financas);}

  /* bottom sheet */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:30;
  }
  .overlay.open{display:flex;}
  .sheet{
    width:100%;
    max-width:430px;
    background:var(--surface);
    border-radius:22px 22px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .25s cubic-bezier(.22,.9,.34,1);
  }
  .overlay.open .sheet{transform:translateY(0);}
  .sheet h2{
    font-family:var(--font-display);
    font-size:19px;
    margin:0 0 16px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .field input, .field select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 12px;
    color:var(--text);
    font-size:15px;
  }
  .field input:focus-visible, .field select:focus-visible, button:focus-visible, .checkbox:focus-visible{
    outline:2px solid var(--current);
    outline-offset:2px;
  }
  .toggle-group{display:flex;gap:8px;}
  .toggle-group button{
    flex:1;
    padding:11px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text-dim);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .toggle-group button.sel{
    color:#14171d;
  }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .sheet-actions button{
    flex:1;
    padding:13px;
    border-radius:12px;
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-cancel{background:var(--surface-2);color:var(--text-dim);}
  .btn-save{background:var(--current);color:#14171d;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="greeting" id="greeting">Olá</div>
    <div class="date" id="dateLabel"></div>
    <div class="section-title"><div class="bar"></div><h1 id="sectionTitle">Agenda</h1></div>
  </header>

  <main id="content"></main>

  <button class="fab" id="fabBtn" aria-label="Adicionar">+</button>

  <nav class="tabbar">
    <button class="tab" data-tab="agenda" aria-label="Agenda">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
      <span class="tlabel">Agenda</span>
      <span class="badge" id="badgeAgenda" style="display:none;"></span>
    </button>
    <button class="tab" data-tab="trabalho" aria-label="Trabalho">
      <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>
      <span class="tlabel">Trabalho</span>
      <span class="badge" id="badgeTrabalho" style="display:none;"></span>
    </button>
    <button class="tab" data-tab="treino" aria-label="Treino">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5 3 10l11 11 3.5-3.5M14.5 3.5 21 10M9 9l6 6M17.5 6.5l-11 11"/></svg>
      <span class="tlabel">Treino</span>
    </button>
    <button class="tab" data-tab="financas" aria-label="Finanças">
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
      <span class="tlabel">Finanças</span>
    </button>
  </nav>

  <div class="overlay" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<script>
const COLORS = { agenda:'#6c9bcf', trabalho:'#e0a458', treino:'#e0665a', financas:'#6fbf8b' };
const TITLES = { agenda:'Agenda', trabalho:'Trabalho', treino:'Treino', financas:'Finanças' };
const STORAGE_KEY = { agenda:'agenda-events', trabalho:'trabalho-tasks', treino:'treino-logs', financas:'financas-transactions' };

let state = { agenda:[], trabalho:[], treino:[], financas:[] };
let currentTab = 'agenda';
let loaded = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function greetingText(){
  const h = new Date().getHours();
  if (h < 12) return 'Bom dia';
  if (h < 18) return 'Boa tarde';
  return 'Boa noite';
}

function setActiveTab(tab){
  currentTab = tab;
  document.documentElement.style.setProperty('--current', COLORS[tab]);
  document.getElementById('sectionTitle').textContent = TITLES[tab];
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  render();
}

async function loadAll(){
  for (const tab of Object.keys(STORAGE_KEY)){
    try{
      const res = await window.storage.get(STORAGE_KEY[tab], false);
      state[tab] = res ? JSON.parse(res.value) : [];
    }catch(e){
      state[tab] = [];
    }
  }
  loaded = true;
}

async function persist(tab){
  try{
    await window.storage.set(STORAGE_KEY[tab], JSON.stringify(state[tab]), false);
  }catch(e){
    console.error('Falha ao salvar', tab, e);
  }
}

function esc(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function updateBadges(){
  const pendentes = state.trabalho.filter(t=>!t.done).length;
  const bTrab = document.getElementById('badgeTrabalho');
  if (pendentes > 0){ bTrab.style.display='flex'; bTrab.textContent = pendentes; } else { bTrab.style.display='none'; }

  const hoje = new Date().toISOString().slice(0,10);
  const eventosHoje = state.agenda.filter(e=>e.date===hoje).length;
  const bAg = document.getElementById('badgeAgenda');
  if (eventosHoje > 0){ bAg.style.display='flex'; bAg.textContent = eventosHoje; } else { bAg.style.display='none'; }
}

function render(){
  const main = document.getElementById('content');
  updateBadges();
  if (currentTab === 'agenda') return renderAgenda(main);
  if (currentTab === 'trabalho') return renderTrabalho(main);
  if (currentTab === 'treino') return renderTreino(main);
  if (currentTab === 'financas') return renderFinancas(main);
}

/* ---------- AGENDA ---------- */
function renderAgenda(main){
  const hoje = new Date().toISOString().slice(0,10);
  const eventos = state.agenda.filter(e=>e.date===hoje).sort((a,b)=>a.time.localeCompare(b.time));
  if (eventos.length === 0){
    main.innerHTML = `<div class="empty"><span class="big">Nada marcado por hoje</span>Toque no + para adicionar um compromisso.</div>`;
    return;
  }
  main.innerHTML = `<div class="card">${eventos.map(e=>`
    <div class="row">
      <div class="row-time">${esc(e.time)}</div>
      <div class="row-title">${esc(e.title)}</div>
      <button class="del-btn" data-del="agenda" data-id="${e.id}">✕</button>
    </div>`).join('')}</div>`;
  bindDeletes(main);
}

/* ---------- TRABALHO ---------- */
function renderTrabalho(main){
  const tasks = [...state.trabalho].sort((a,b)=>Number(a.done)-Number(b.done));
  if (tasks.length === 0){
    main.innerHTML = `<div class="empty"><span class="big">Nenhuma tarefa por aqui</span>Toque no + para adicionar uma tarefa.</div>`;
    return;
  }
  main.innerHTML = `<div class="card">${tasks.map(t=>`
    <div class="row">
      <div class="checkbox ${t.done?'checked':''}" data-toggle="${t.id}" role="checkbox" aria-checked="${t.done}" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="#14171d" stroke-width="3"><path d="M5 12l5 5L19 7"/></svg>
      </div>
      <div class="row-title ${t.done?'done':''}">${esc(t.title)}</div>
      <button class="del-btn" data-del="trabalho" data-id="${t.id}">✕</button>
    </div>`).join('')}</div>`;
  bindDeletes(main);
  main.querySelectorAll('[data-toggle]').forEach(el=>{
    const toggle = ()=>{
      const item = state.trabalho.find(t=>t.id===el.dataset.toggle);
      item.done = !item.done;
      persist('trabalho');
      render();
    };
    el.addEventListener('click', toggle);
    el.addEventListener('keydown', ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); toggle(); }});
  });
}

/* ---------- TREINO ---------- */
function renderTreino(main){
  const logs = [...state.treino].sort((a,b)=> b.date.localeCompare(a.date));
  const now = new Date();
  const startWeek = new Date(now); startWeek.setDate(now.getDate() - now.getDay());
  const startStr = startWeek.toISOString().slice(0,10);
  const semana = state.treino.filter(l=>l.date >= startStr).length;

  let html = `<div class="stat-pill">💪 ${semana} treino${semana===1?'':'s'} esta semana</div>`;
  if (logs.length === 0){
    html += `<div class="empty"><span class="big">Nenhum treino registrado</span>Toque no + para registrar seu treino de hoje.</div>`;
  } else {
    html += `<div class="card">${logs.map(l=>`
      <div class="row">
        <div class="row-time">${formatDateShort(l.date)}</div>
        <div style="flex:1">
          <div class="row-title">${esc(l.tipo)}</div>
          <div class="row-sub">${l.duracao} min</div>
        </div>
        <button class="del-btn" data-del="treino" data-id="${l.id}">✕</button>
      </div>`).join('')}</div>`;
  }
  main.innerHTML = html;
  bindDeletes(main);
}

function formatDateShort(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
}

/* ---------- FINANCAS ---------- */
function renderFinancas(main){
  const saldo = state.financas.reduce((acc,t)=> acc + (t.tipo==='entrada'? t.valor : -t.valor), 0);
  const txs = [...state.financas].sort((a,b)=> b.id.localeCompare(a.id));
  let html = `<div class="balance-card">
    <div class="label">Saldo</div>
    <div class="amount ${saldo>=0?'pos':'neg'}">${formatMoney(saldo)}</div>
  </div>`;
  if (txs.length === 0){
    html += `<div class="empty"><span class="big">Nenhuma movimentação</span>Toque no + para registrar uma entrada ou saída.</div>`;
  } else {
    html += `<div class="card">${txs.map(t=>`
      <div class="row">
        <div style="flex:1">
          <div class="row-title">${esc(t.desc)}</div>
        </div>
        <div class="tx-amount ${t.tipo==='entrada'?'pos':'neg'}">${t.tipo==='entrada'?'+':'−'} ${formatMoney(t.valor)}</div>
        <button class="del-btn" data-del="financas" data-id="${t.id}">✕</button>
      </div>`).join('')}</div>`;
  }
  main.innerHTML = html;
  bindDeletes(main);
}

function formatMoney(v){
  return Math.abs(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}

function bindDeletes(main){
  main.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const tab = btn.dataset.del;
      state[tab] = state[tab].filter(item=>item.id !== btn.dataset.id);
      persist(tab);
      render();
    });
  });
}

/* ---------- SHEET (add forms) ---------- */
function openSheet(){ document.getElementById('overlay').classList.add('open'); }
function closeSheet(){ document.getElementById('overlay').classList.remove('open'); }

document.getElementById('overlay').addEventListener('click', e=>{
  if (e.target.id === 'overlay') closeSheet();
});

document.getElementById('fabBtn').addEventListener('click', ()=>{
  const sheet = document.getElementById('sheet');
  if (currentTab === 'agenda') sheet.innerHTML = agendaForm();
  if (currentTab === 'trabalho') sheet.innerHTML = trabalhoForm();
  if (currentTab === 'treino') sheet.innerHTML = treinoForm();
  if (currentTab === 'financas') sheet.innerHTML = financasForm();
  wireSheet();
  openSheet();
});

function agendaForm(){
  return `<h2>Novo compromisso</h2>
    <div class="field"><label for="f-time">Horário</label><input id="f-time" type="time" value="09:00"></div>
    <div class="field"><label for="f-title">O que é</label><input id="f-title" type="text" placeholder="Ex: Reunião com o time" maxlength="60"></div>
    ${sheetActions('agenda')}`;
}
function trabalhoForm(){
  return `<h2>Nova tarefa</h2>
    <div class="field"><label for="f-title">Descrição</label><input id="f-title" type="text" placeholder="Ex: Enviar proposta" maxlength="80"></div>
    ${sheetActions('trabalho')}`;
}
function treinoForm(){
  return `<h2>Registrar treino</h2>
    <div class="field"><label for="f-tipo">Tipo de treino</label><input id="f-tipo" type="text" placeholder="Ex: Corrida, Musculação" maxlength="40"></div>
    <div class="field"><label for="f-duracao">Duração (minutos)</label><input id="f-duracao" type="number" min="1" max="600" placeholder="45"></div>
    ${sheetActions('treino')}`;
}
function financasForm(){
  return `<h2>Nova movimentação</h2>
    <div class="field"><label>Tipo</label>
      <div class="toggle-group" id="tipo-toggle">
        <button type="button" data-val="entrada" class="sel" style="background:var(--financas);color:#14171d;">Entrada</button>
        <button type="button" data-val="saida">Saída</button>
      </div>
    </div>
    <div class="field"><label for="f-desc">Descrição</label><input id="f-desc" type="text" placeholder="Ex: Salário, Mercado" maxlength="60"></div>
    <div class="field"><label for="f-valor">Valor (R$)</label><input id="f-valor" type="number" min="0" step="0.01" placeholder="0,00"></div>
    ${sheetActions('financas')}`;
}
function sheetActions(tab){
  return `<div class="sheet-actions">
    <button type="button" class="btn-cancel" id="cancelBtn">Cancelar</button>
    <button type="button" class="btn-save" id="saveBtn" data-savetab="${tab}">Salvar</button>
  </div>`;
}

function wireSheet(){
  document.getElementById('cancelBtn').addEventListener('click', closeSheet);

  const tipoToggle = document.getElementById('tipo-toggle');
  if (tipoToggle){
    tipoToggle.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        tipoToggle.querySelectorAll('button').forEach(o=>{ o.classList.remove('sel'); o.style.background=''; o.style.color=''; });
        b.classList.add('sel');
        b.style.background = b.dataset.val==='entrada' ? 'var(--financas)' : 'var(--treino)';
        b.style.color = '#14171d';
      });
    });
  }

  document.getElementById('saveBtn').addEventListener('click', async ()=>{
    const tab = document.getElementById('saveBtn').dataset.savetab;
    if (tab === 'agenda'){
      const time = document.getElementById('f-time').value;
      const title = document.getElementById('f-title').value.trim();
      if (!title) return;
      state.agenda.push({ id: uid(), date: new Date().toISOString().slice(0,10), time: time || '00:00', title });
      await persist('agenda');
    }
    if (tab === 'trabalho'){
      const title = document.getElementById('f-title').value.trim();
      if (!title) return;
      state.trabalho.push({ id: uid(), title, done:false });
      await persist('trabalho');
    }
    if (tab === 'treino'){
      const tipo = document.getElementById('f-tipo').value.trim();
      const duracao = parseInt(document.getElementById('f-duracao').value) || 0;
      if (!tipo) return;
      state.treino.push({ id: uid(), date: new Date().toISOString().slice(0,10), tipo, duracao });
      await persist('treino');
    }
    if (tab === 'financas'){
      const tipoBtn = document.querySelector('#tipo-toggle button.sel');
      const tipo = tipoBtn ? tipoBtn.dataset.val : 'entrada';
      const desc = document.getElementById('f-desc').value.trim();
      const valor = parseFloat(document.getElementById('f-valor').value) || 0;
      if (!desc || valor <= 0) return;
      state.financas.push({ id: uid(), desc, valor, tipo });
      await persist('financas');
    }
    closeSheet();
    render();
  });
}

document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=> setActiveTab(btn.dataset.tab));
});

(async function init(){
  document.getElementById('greeting').textContent = greetingText();
  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
  document.getElementById('content').innerHTML = `<div class="empty">Carregando seus dados…</div>`;
  await loadAll();
  setActiveTab('agenda');
})();
</script>
</body>
</html>
